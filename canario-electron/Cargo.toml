[package]
name = "canario-electron"
version = "0.2.0-rc.1"
edition = "2021"
description = "Sidecar binary for Canario Electron — JSON stdin/stdout bridge over canario-core"

[dependencies]
canario-core = { path = "../canario-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

[dev-dependencies]
tempfile = "3"
# Protocol tests only: query the host's default input device by name so
# the list_audio_devices test can assert its presence when a mic exists.
cpal = "0.16"
