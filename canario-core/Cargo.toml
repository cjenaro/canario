[package]
name = "canario-core"
version = "0.1.2"
edition = "2021"
description = "Core library for Canario voice-to-text — bring your own frontend"
license = "MIT"

[features]
default = ["x11", "linux-input"]
static = ["sherpa-onnx/static"]
shared = ["sherpa-onnx/shared"]
# Platform-specific features (Linux-only dependencies, see below)
x11 = ["dep:x11rb"]
linux-input = ["dep:evdev"]

[dependencies]
# ASR engine
sherpa-onnx = { version = "1.12", default-features = false }

# Audio capture + playback
cpal = "0.16"
rodio = "0.20"
rubato = { version = "5", default-features = false }

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP (model download)
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"

# Integrity (SHA-256 verification of downloaded model files)
sha2 = "0.10"

# Logging
tracing = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Utilities
anyhow = "1"
dirs = "6"
parking_lot = "0.12"
arboard = "3.6"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3"

# Linux-only hotkey backends (enabled via the `x11` / `linux-input` features)
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", optional = true }
evdev = { version = "0.13", optional = true }

# macOS paste injection: CoreGraphics CGEvent (Cmd+V)
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"

# Windows paste injection: Win32 SendInput (Ctrl+V)
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse"] }
