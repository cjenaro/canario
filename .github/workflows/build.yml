name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Build Rust sidecar for all platforms ─────────────────────────────
  # Each target maps 1:1 to a sherpa-onnx prebuilt archive (sherpa-onnx-sys
  # build.rs picks it from CARGO_CFG_TARGET_OS/ARCH; version pinned by
  # Cargo.lock): linux-x64, osx-x64, osx-arm64, win-x64 — static link mode
  # (default when no sherpa feature is enabled) so the sidecar is
  # self-contained and needs no runtime .so/.dylib/.dll staging.
  build-sidecar:
    strategy:
      matrix:
        include:
          # Native builds; their artifacts are consumed by build-electron
          # via the `sidecar-${{ matrix.os }}` name — do not rename.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            upload: true
          - os: macos-latest        # arm64 host
            target: aarch64-apple-darwin
            upload: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            upload: true
          # Compile coverage for osx-x64 (the remaining prebuilt archive
          # target): cross-compiled on the arm64 runner with the x86_64
          # sherpa static libs. Not packaged today, so it is not uploaded —
          # keeping the artifact contract for downstream jobs unchanged.
          - os: macos-latest
            target: x86_64-apple-darwin
            upload: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libasound2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # Installs the target std (no-op for host triples; enables the
          # x86_64-apple-darwin cross-build on the arm64 macOS runner).
          targets: ${{ matrix.target }}

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Cache sherpa-onnx prebuilt libs
        uses: actions/cache@v4
        with:
          # sherpa-onnx-sys build.rs auto-downloads the archive matching
          # matrix.target into target/sherpa-onnx-prebuilt/<archive-stem>/
          # on first build, so the cache is keyed per target.
          path: target/sherpa-onnx-prebuilt
          key: sherpa-onnx-prebuilt-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}

      - name: Build sidecar
        run: cargo build --release --bin canario-electron --target ${{ matrix.target }}

      - name: Prepare sidecar directory (Linux/macOS)
        if: matrix.upload && runner.os != 'Windows'
        # Deliberately NOT scripts/stageSidecar.cjs (canario-7ah.13
        # evaluation): the two paths guard different risks. CI's copy is
        # fresh by construction — the binary was built from this exact
        # checkout seconds earlier, so a staleness check could only add
        # failure modes (runner clock skew, checkout mtimes) with zero
        # safety gained. stageSidecar.cjs exists precisely for the local
        # flow, where a stale target/release binary is the real hazard;
        # it also stages from target/release (host triple) while CI
        # stages from the cross-target dir below. Kept as two small,
        # individually obvious steps instead of a shared abstraction
        # with mode flags.
        shell: bash
        run: |
          mkdir -p canario-app/sidecar
          cp -f target/${{ matrix.target }}/release/canario-electron canario-app/sidecar/
          chmod +x canario-app/sidecar/canario-electron

      - name: Prepare sidecar directory (Windows)
        if: matrix.upload && runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path canario-app/sidecar | Out-Null
          Copy-Item -Force -Path target/${{ matrix.target }}/release/canario-electron.exe -Destination canario-app/sidecar/

      - name: Upload sidecar artifact
        if: matrix.upload
        uses: actions/upload-artifact@v4
        with:
          name: sidecar-${{ matrix.os }}
          path: canario-app/sidecar/
          if-no-files-found: error
          retention-days: 1

  # ── Build & package Electron app for all platforms ───────────────────
  build-electron:
    needs: build-sidecar
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            builder-flag: --linux
          - os: macos-latest
            builder-flag: --mac
          - os: windows-latest
            builder-flag: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Download sidecar
        uses: actions/download-artifact@v4
        with:
          name: sidecar-${{ matrix.os }}
          path: canario-app/sidecar/

      - name: Make sidecar executable
        if: runner.os != 'Windows'
        run: chmod +x canario-app/sidecar/canario-electron

      # @jitsi/robotjs compiles from source against Electron's ABI
      # (no usable prebuild): on Linux it needs the X11 dev headers
      # its keycode/keyboard code includes. The runner images don't
      # ship them. robotjs is unused at runtime on Linux (paste goes
      # through the sidecar's native path there); retiring it —
      # canario "Retire @jitsi/robotjs" bead — removes this step too.
      - name: Install X11 headers (Linux robotjs build)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libx11-dev libxtst-dev libxinerama-dev libxkbfile-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: canario-app/package-lock.json

      - name: Install dependencies
        working-directory: canario-app
        run: npm ci

      - name: Build renderer
        working-directory: canario-app
        run: npm run build

      - name: Package (electron-builder)
        working-directory: canario-app
        run: npx electron-builder ${{ matrix.builder-flag }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: canario-${{ matrix.os }}
          path: |
            canario-app/dist/*.AppImage
            canario-app/dist/*.deb
            canario-app/dist/*.dmg
            canario-app/dist/*.exe
            canario-app/dist/*.zip
            canario-app/dist/*.blockmap
            canario-app/dist/latest*.yml
          if-no-files-found: error
          retention-days: 30

  # ── Create GitHub Release ────────────────────────────────────────────
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-electron
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: List artifacts
        run: find artifacts/ -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/canario-ubuntu-latest/**/*
            artifacts/canario-macos-latest/**/*
            artifacts/canario-windows-latest/**/*
